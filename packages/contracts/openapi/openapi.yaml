openapi: 3.1.0
info:
  title: DentaMonitor Iran Foundation API
  version: 0.2.0
  description: Identity and tenant foundation contract. Clinical APIs remain release-gated.
servers:
  - url: /api/v1
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report process health and dependency configuration state
      responses:
        "200":
          description: Process health; may be degraded while dependencies are unavailable
          headers:
            X-Request-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Require PostgreSQL and Redis readiness
      responses:
        "200":
          description: Required dependencies are ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503": { $ref: "#/components/responses/Problem" }
  /auth/patient/otp/request:
    post:
      operationId: requestPatientOtp
      summary: Request a single-purpose patient OTP with a generic response
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpRequest" }
      responses:
        "202":
          description: Request accepted whether or not the identity is eligible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpChallenge" }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /auth/patient/otp/verify:
    post:
      operationId: verifyPatientOtp
      summary: Consume an OTP and create a patient session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpVerification" }
      responses:
        "200":
          description: OTP consumed and session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /auth/token/refresh:
    post:
      operationId: refreshAccessToken
      summary: Rotate a refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 32, maxLength: 256 }
      responses:
        "200":
          description: Refresh token rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResponse" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/me:
    get:
      operationId: getCurrentPrincipal
      summary: Return the authenticated user and effective memberships
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Effective principal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Principal" }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current server-side session
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: RFC 9457-compatible problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, environment, version, request_id, dependencies]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string }
        environment: { type: string }
        version: { type: string }
        request_id: { type: string }
        dependencies:
          type: object
          additionalProperties: false
          required: [database, cache, object_storage, workflow]
          properties:
            database: { $ref: "#/components/schemas/DependencyState" }
            cache: { $ref: "#/components/schemas/DependencyState" }
            object_storage: { $ref: "#/components/schemas/DependencyState" }
            workflow: { $ref: "#/components/schemas/DependencyState" }
    DependencyState:
      type: string
      enum: [UP, DOWN, DEGRADED, NOT_CONFIGURED]
    OtpRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          minLength: 8
          maxLength: 32
          description: Iranian mobile; normalized server-side to E.164 and never stored in plaintext.
    OtpChallenge:
      type: object
      additionalProperties: false
      required: [status, challenge_id, expires_in, resend_after]
      properties:
        status: { type: string, const: accepted }
        challenge_id: { type: string, format: uuid }
        expires_in: { type: integer, minimum: 60, maximum: 600 }
        resend_after: { type: integer, minimum: 1 }
    OtpVerification:
      type: object
      additionalProperties: false
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, format: uuid }
        code: { type: string, pattern: "^[0-9]{6}$" }
    Membership:
      type: object
      additionalProperties: false
      required: [organization_id, clinic_id, role]
      properties:
        organization_id: { type: string, format: uuid }
        clinic_id:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        role:
          type: string
          enum: [PLATFORM_ADMIN, SECURITY_AUDITOR, SUPPORT_AGENT, ORG_OWNER, CLINIC_ADMIN, DOCTOR, CLINICAL_ASSISTANT, RECEPTION, FINANCE, ANNOTATOR, ADJUDICATOR, ML_RESEARCHER, ML_APPROVER, PATIENT, GUARDIAN, INTEGRATION_CLIENT]
    TokenResponse:
      allOf:
        - { $ref: "#/components/schemas/RefreshResponse" }
        - type: object
          required: [user]
          properties:
            user:
              type: object
              required: [id, memberships]
              properties:
                id: { type: string, format: uuid }
                memberships:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/Membership" }
    RefreshResponse:
      type: object
      additionalProperties: false
      required: [token_type, access_token, expires_in, refresh_token, refresh_expires_at]
      properties:
        token_type: { type: string, const: Bearer }
        access_token: { type: string }
        expires_in: { type: integer, minimum: 300, maximum: 3600 }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
    Principal:
      type: object
      additionalProperties: false
      required: [user_id, session_id, memberships]
      properties:
        user_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        memberships:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Membership" }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, instance, request_id]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
