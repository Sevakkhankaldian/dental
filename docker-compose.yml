name: dentamonitor-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dentamonitor
      POSTGRES_USER: dentamonitor
      POSTGRES_PASSWORD: local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dentamonitor -d dentamonitor"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/database/migrations/0001_foundation.sql:/docker-entrypoint-initdb.d/0001_foundation.sql:ro
      - ./data/synthetic/seed-foundation.sql:/docker-entrypoint-initdb.d/0002_seed.sql:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dentamonitor-local
      MINIO_ROOT_PASSWORD: local-only-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: dentamonitor
      POSTGRES_PWD: local-only
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"

volumes:
  postgres-data:
  redis-data:
  minio-data:
