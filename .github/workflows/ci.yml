name: foundation-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dentamonitor
          POSTGRES_USER: dentamonitor
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dentamonitor -d dentamonitor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://dentamonitor:ci-only@localhost:5432/dentamonitor
      TEST_DATABASE_URL: postgresql://dentamonitor:ci-only@localhost:5432/dentamonitor
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes
      OTP_PHONE_PEPPER: ci-only-phone-pepper-at-least-24-bytes
      IP_HASH_PEPPER: ci-only-ip-pepper-at-least-24-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate
      - run: pnpm run typecheck:api
      - run: pnpm run test:domain
      - run: pnpm run test:api
      - run: pnpm run build:api
      - run: pnpm run build:web
      - run: node --test tests/rendered-html.test.mjs
